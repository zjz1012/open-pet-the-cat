<!doctype html>
<html lang="zh-CN" data-paper="cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纸片立体书 × 100% 真实游戏实机画面 — 65秒温馨宣传片预览</title>
  <style>
    :root {
      --desk: #e4d5c0;
      --cover: #a96941;
      --page: #fbf6eb;
      --page-edge: #e7dac5;
      --ink: #382d24;
      --muted: #7a6c5e;
      --accent: #b86c36;
      --tape-a: rgba(154, 214, 194, 0.78);
      --tape-b: rgba(255, 188, 158, 0.80);
      --border: rgba(74, 58, 44, 0.14);
    }
    html[data-paper="sakura"] {
      --desk: #ebd7dc;
      --cover: #c97c95;
      --page: #fff5f8;
      --page-edge: #f3dce4;
      --accent: #c96889;
      --tape-a: rgba(255, 188, 212, 0.82);
      --tape-b: rgba(255, 224, 175, 0.80);
    }
    html[data-paper="kraft"] {
      --desk: #d6c2a8;
      --cover: #6e4a30;
      --page: #f2e4cc;
      --page-edge: #dec9aa;
      --accent: #8e5226;
      --tape-a: rgba(212, 168, 114, 0.82);
      --tape-b: rgba(156, 188, 162, 0.78);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 25% 0%, #f7efe2, #eadcc8);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 28px;
    }
    .wrap {
      width: min(1080px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(184, 108, 54, 0.15);
      color: var(--accent);
    }
    .title-group p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .paper-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .theme-btn {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fffdf8;
      color: var(--ink);
      cursor: pointer;
    }
    .theme-btn[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }

    /* 16:9 Cinema Frame: Tactile Paper Pop-up Book wrapping the 100% REAL WebGL2 Game Canvas */
    .cinema-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(110, 78, 48, 0.05) 0 2px, transparent 2px 86px),
        var(--desk);
      box-shadow: 0 24px 56px -24px rgba(56, 42, 28, 0.38);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.4% 4.5%;
      transition: background-color 0.4s ease;
    }
    .cinema-stage[data-atmos="night"] {
      background: #172031;
    }
    .cinema-stage[data-atmos="rain"] {
      background: #cdd8e4;
    }

    /* Hardcover Pop-up Book Spread */
    .book-cover {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: var(--cover);
      padding: 12px 14px 16px;
      box-shadow: 0 24px 44px -14px rgba(42, 28, 16, 0.42), inset 0 1px 0 rgba(255,255,255,0.22);
      display: flex;
      transition: background-color 0.4s ease;
    }
    .cinema-stage[data-atmos="night"] .book-cover { background: #26354f; }

    .book-pages {
      position: relative;
      flex: 1;
      border-radius: 12px;
      background: var(--page);
      box-shadow: 0 6px 0 var(--page-edge), inset 0 0 24px rgba(80, 56, 32, 0.08);
      padding: 2.8% 3.4% 6.5%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.45s ease;
    }
    .cinema-stage[data-atmos="night"] .book-pages {
      background: #1d2a40;
      box-shadow: 0 6px 0 #131c2c;
    }
    .cinema-stage[data-atmos="rain"] .book-pages {
      background: #e6eef5;
      box-shadow: 0 6px 0 #cfdbe6;
    }

    /* Book center spine crease */
    .book-gutter {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 48px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(64, 42, 22, 0.14), transparent);
      pointer-events: none;
      z-index: 4;
    }

    /* Washi tape corner strips */
    .washi {
      position: absolute;
      width: 96px;
      height: 24px;
      z-index: 8;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(60, 40, 20, 0.12);
    }
    .washi-tl { top: 14px; left: 10px; background: var(--tape-a); transform: rotate(-24deg); }
    .washi-tr { top: 14px; right: 10px; background: var(--tape-b); transform: rotate(24deg); }

    /* Pop-up Cutout Frame holding the 100% REAL WebGL2 Game Canvas */
    .real-game-window {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #d6c8b4;
      box-shadow:
        0 18px 34px -14px rgba(48, 32, 18, 0.36),
        0 0 0 4px rgba(255, 255, 255, 0.85);
      z-index: 2;
    }
    .cinema-stage[data-atmos="night"] .real-game-window {
      box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.55), 0 0 0 4px rgba(170, 200, 240, 0.28);
    }
    #real-cat-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Pop-up paper sticker tags */
    .pop-tag {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 252, 246, 0.94);
      border: 1.5px solid rgba(130, 94, 60, 0.24);
      color: #463527;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 18px -6px rgba(52, 36, 20, 0.28);
    }
    .breed-pop-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 10;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 45, 36, 0.86);
      color: #fff8ee;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 18px -6px rgba(32, 20, 10, 0.34);
      opacity: 0;
      transform: translateY(-6px) scale(0.95);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .breed-pop-badge.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Pop-up Intro Ribbon */
    .intro-ribbon {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translate(-50%, -14px) scale(0.94);
      z-index: 11;
      padding: 12px 28px;
      border-radius: 16px;
      background: rgba(255, 252, 245, 0.95);
      border: 2px solid rgba(184, 108, 54, 0.28);
      box-shadow: 0 18px 34px -12px rgba(48, 32, 18, 0.32);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.9, 0.2, 1);
    }
    .intro-ribbon.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }
    .intro-ribbon strong {
      display: block;
      font-size: clamp(20px, 2.8vw, 32px);
      color: #463222;
      letter-spacing: 0.04em;
    }
    .intro-ribbon span {
      display: block;
      margin-top: 3px;
      font-size: clamp(11px, 1.3vw, 14px);
      color: #8c6d52;
    }

    /* Live Captured Polaroid Pop-out Card */
    .polaroid-pop {
      position: absolute;
      right: 3.5%;
      bottom: 13%;
      width: 26%;
      z-index: 12;
      transform: rotate(6deg) translateY(36px) scale(0.86);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.1);
      filter: drop-shadow(0 18px 26px rgba(42, 28, 16, 0.38));
    }
    .polaroid-pop.show {
      opacity: 1;
      transform: rotate(5deg) translateY(0) scale(1);
    }
    #polaroid-shot {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    /* Camera shutter flash */
    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 14;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }
    .shutter-flash.active {
      opacity: 0.9;
      transition: none;
    }

    /* End Card */
    .end-card {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translate(-50%, -10px);
      z-index: 13;
      padding: 16px 32px;
      border-radius: 18px;
      background: rgba(20, 30, 48, 0.88);
      border: 1.5px solid rgba(185, 212, 248, 0.32);
      color: #eef5ff;
      text-align: center;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .end-card.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .end-card strong {
      display: block;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.04em;
    }
    .end-card span {
      display: block;
      margin-top: 6px;
      font-size: clamp(12px, 1.4vw, 15px);
      color: #b4ccf0;
    }

    /* Paper-cut bottom subtitle pill */
    .subtitle-pill {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 15;
      max-width: 90%;
      padding: 6px 20px;
      border-radius: 999px;
      background: rgba(255, 252, 246, 0.94);
      border: 1.5px solid rgba(130, 94, 60, 0.22);
      color: #3a2d23;
      font-size: clamp(12px, 1.5vw, 17px);
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 16px rgba(48, 32, 18, 0.18);
    }
    .cinema-stage[data-atmos="night"] .subtitle-pill {
      background: rgba(22, 34, 54, 0.90);
      border-color: rgba(180, 208, 245, 0.28);
      color: #e9f2ff;
    }

    /* Playback controls */
    .controls {
      background: #fffdf9;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .play-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .audio-btn {
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f6efe4;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .audio-btn[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
      color: var(--muted);
      min-width: 90px;
      text-align: center;
    }
    input[type="range"].scrub {
      flex: 1;
      min-width: 160px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .chap {
      border: 1px solid var(--border);
      background: #faf5ec;
      color: var(--ink);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 11.5px;
      text-align: left;
      cursor: pointer;
    }
    .chap.active {
      background: rgba(184, 108, 54, 0.16);
      border-color: var(--accent);
      color: #7a4218;
      font-weight: 600;
    }
    .chap span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
    @media (max-width: 760px) { .chapters { grid-template-columns: repeat(3, 1fr); } }

    /* Clean full-bleed 16:9 cinema render mode (?render=1) for 1080p MP4 capture! */
    body.render-mode {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--desk);
    }
    body.render-mode .wrap {
      width: 100vw;
      height: 100vh;
      gap: 0;
    }
    body.render-mode .top,
    body.render-mode .controls {
      display: none !important;
    }
    body.render-mode .cinema-stage {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <script>if (location.search.includes('render=1')) document.body.classList.add('render-mode');</script>
  <div class="wrap">
    <div class="top">
      <div class="title-group">
        <h1>纸片立体书 × 100% 真实游戏实机画面 <span class="pill">Lemo-Opuscar · paper-popup × 实机零货不对板</span></h1>
        <p>画面中的猫、20层毛发、手势、排梳、毛球、激光追逐、拍立得与雨夜光影均由真实 WebGL2 游戏引擎实时运行！</p>
      </div>
      <div class="paper-switcher" role="group" aria-label="切换立体书纸张配色">
        <button class="theme-btn" type="button" data-paper-theme="cream" aria-pressed="true">奶油手账纸</button>
        <button class="theme-btn" type="button" data-paper-theme="sakura" aria-pressed="false">樱花粉卡纸</button>
        <button class="theme-btn" type="button" data-paper-theme="kraft" aria-pressed="false">复古牛皮纸</button>
      </div>
    </div>

    <div id="book-spread" class="cinema-stage" data-atmos="day">
      <div class="book-cover">
        <div class="book-pages">
          <div class="book-gutter" aria-hidden="true"></div>
          <div class="washi washi-tl" aria-hidden="true"></div>
          <div class="washi washi-tr" aria-hidden="true"></div>

          <div class="real-game-window">
            <canvas id="real-cat-canvas"></canvas>
            <div id="pop-tag" class="pop-tag">📖 100% 实机录制 · 窗边暖阳</div>
            <div id="breed-pop-badge" class="breed-pop-badge">橘猫</div>

            <div id="intro-ribbon" class="intro-ribbon">
              <strong>呼噜噜云撸猫</strong>
              <span>100% 实机画面 · 20 层体积毛发 &amp; 贴耳呼噜 ASMR</span>
            </div>

            <div id="polaroid-pop" class="polaroid-pop">
              <canvas id="polaroid-shot"></canvas>
            </div>

            <div id="end-card" class="end-card">
              <strong>呼噜噜云撸猫 🐾</strong>
              <span>点击评论区或视频下方 Toy 链接即可直接玩 · 关注「知喵~」解锁全猫种</span>
            </div>

            <div id="shutter-flash" class="shutter-flash"></div>
          </div>

          <div id="subtitle-pill" class="subtitle-pill">
            忙了一整天，翻开这本会呼噜的猫猫立体书，一只暖呼呼的小猫正在窗边等你。
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="bar-row">
        <button id="play-btn" class="play-btn" type="button">暂停 ⏸</button>
        <button id="audio-btn" class="audio-btn" type="button" aria-pressed="true">🔊 舒缓配乐 + 呼噜：开</button>
        <input id="scrub" class="scrub" type="range" min="0" max="65" step="0.05" value="0" />
        <div id="time-readout" class="time-readout">00:00 / 01:05</div>
      </div>
      <div id="chapters" class="chapters"></div>
    </div>
  </div>

  <script type="module" src="/src/promo/popupRealTrailer.ts"></script>
</body>
</html>
